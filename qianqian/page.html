  <style>
*{box-sizing:border-box;margin:0;padding:0}

/* 深色（:root 就是深色，data-theme="dark" 不用再写一份） */
:root{
  --bg:#12141a;--panel:#181b23;--line:#242936;--txt:#e8eaf0;--dim:#8b93a7;
  --acc:#7b8cff;--acc2:#a06bff;
  --hover:#1e222c;--sel:#202634;--input:#0e1015;--cover:#242a38;
  --now-bar:#17211d;--on-acc-text:#0b1410;
  --heart:#3a4155;--heart-on:#ff5c5c;
  --ico-from:#2b3348;--tag-line:#234136;
  --shadow:none;
}

/* 浅色 */
:root[data-theme="light"]{
  --bg:#f5f6fa;--panel:#ffffff;--line:#e2e6ef;--txt:#1a1e26;--dim:#6a7280;
  --acc:#12a56a;--acc2:#2979ff;
  --hover:#f0f2f8;--sel:#e9edf7;--input:#ffffff;--cover:#e7eaf2;
  --now-bar:#e6f6ee;--on-acc-text:#ffffff;
  --heart:#b9c0cd;--heart-on:#e5484d;
  --ico-from:#dfe5f2;--tag-line:#b6e3cd;
  --shadow:0 1px 2px rgba(16,24,40,.04);
}

/* 橘黄（暖色浅底，主色是橘黄，强调色偏暖红） */
:root[data-theme="amber"]{
  --bg:#fdf6ec;--panel:#fffcf6;--line:#f0dfc6;--txt:#2b2116;--dim:#8b7561;
  --acc:#e8861a;--acc2:#d9542d;
  --hover:#fbefdd;--sel:#f9e3c4;--input:#fffdf8;--cover:#f4e6d2;
  --now-bar:#fdecce;--on-acc-text:#ffffff;
  --heart:#d8c3a6;--heart-on:#e04b3a;
  --ico-from:#f5e7d3;--tag-line:#f3d6a8;
  --shadow:0 1px 2px rgba(120,80,20,.06);
}

html,body,#root{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;transition:background .18s,color .18s}
.app{display:grid;grid-template-columns:1fr;grid-template-rows:36px 58px 1fr 96px 26px;height:100%;min-height:0}

/* ── 顶部菜单栏（对应 Audacious 的 File / Playback / Playlist …） ── */
.menubar{display:flex;flex-direction:row;align-items:center;gap:4px;padding:0 10px;background:var(--panel);
  border-bottom:1px solid var(--line);min-width:0;overflow:hidden}
.bar-logo{width:22px;height:22px;border-radius:5px;object-fit:cover;flex:0 0 auto}
.app-name{font-size:12.5px;font-weight:600;color:var(--txt);white-space:nowrap;margin:0 10px 0 7px;letter-spacing:.4px}

.menus::-webkit-scrollbar{display:none}
.menus{display:flex;flex-direction:row;align-items:center;gap:2px;min-width:0;height:100%;overflow-x:auto;scrollbar-width:none}
.menus::-webkit-scrollbar{display:none}
.menus button{flex:0 0 auto;border:none;background:transparent;color:var(--txt);font-size:12.5px;line-height:1;padding:7px 11px;
  border-radius:5px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.menus button:hover{background:var(--hover)}
.menus button.on{background:var(--acc);color:#fff}
.menus .count{font-size:10px;opacity:.62;background:rgba(0,0,0,.10);padding:0 5px;border-radius:8px;min-width:14px;text-align:center}
.menus button.on .count{background:rgba(255,255,255,.24);opacity:.95}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:4px;flex:0 0 auto}

/* ── 工具栏（对应 Audacious 的播放控制 + 进度 + 音量） ── */
.toolbar{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);
  border-bottom:1px solid var(--line);min-width:0}
.tb-search{display:flex;gap:4px;flex:0 0 auto;width:250px}
.tb-search input{flex:1;min-width:0}
.tb-search button{flex:0 0 auto}
.tb-controls{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.tb-btn{border:1px solid transparent;background:transparent;color:var(--txt);cursor:pointer;
  width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.tb-btn:hover{background:var(--hover);border-color:var(--line)}
.tb-btn:disabled{opacity:.38;cursor:default}
.tb-btn.act{color:var(--acc);border-color:var(--line);background:var(--hover)}
.tb-play{width:34px;height:32px;font-size:16px}
.tb-progress{display:flex;align-items:center;gap:8px;flex:1;min-width:120px}
.tb-progress span{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.tb-progress input,.tb-vol input{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--line);outline:none;cursor:pointer}
.tb-progress input::-webkit-slider-thumb,.tb-vol input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);border:0;cursor:pointer}
.tb-vol{display:flex;align-items:center;gap:6px;flex:0 0 auto;width:120px}
.tb-vol input{width:84px}
.live-tag{font-size:11px;color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:2px 9px;flex:0 0 auto}

/* ── Audacious 底部深色 Now Playing 信息带 ── */
.nowband{display:flex;align-items:center;gap:14px;padding:10px 14px;background:#111318;color:#fff;
  border-top:1px solid rgba(255,255,255,.06);cursor:pointer;overflow:hidden}
.nowband:hover{background:#15171e}
.nb-cover{width:74px;height:74px;flex:0 0 auto;border-radius:6px;background-color:#23262f;
  background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.45);font-size:20px;color:rgba(255,255,255,.35)}
.nb-info{flex:0 0 auto;min-width:0;max-width:34%;display:flex;flex-direction:column;gap:2px}
.nb-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-artist{font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-album{font-size:11.5px;color:rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-lyric{flex:1;min-width:0;font-size:14px;color:#ff9a4d;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:center;padding:0 8px}
.nb-vis{display:flex;align-items:flex-end;gap:3px;height:44px;flex:0 0 auto;padding-right:4px}
.nb-vis i{width:4px;background:linear-gradient(180deg,#4db6ff,#8a5cff);border-radius:1px;
  transform-origin:bottom;animation:vis .9s ease-in-out infinite alternate}
.nb-vis i:nth-child(1){height:36%;animation-delay:0s}
.nb-vis i:nth-child(2){height:62%;animation-delay:.12s}
.nb-vis i:nth-child(3){height:44%;animation-delay:.24s}
.nb-vis i:nth-child(4){height:80%;animation-delay:.36s}
.nb-vis i:nth-child(5){height:34%;animation-delay:.48s}
.nb-vis i:nth-child(6){height:70%;animation-delay:.6s}
.nb-vis i:nth-child(7){height:48%;animation-delay:.72s}
.nb-vis i:nth-child(8){height:88%;animation-delay:.84s}
.nb-vis i:nth-child(9){height:40%;animation-delay:.96s}
.nb-vis i:nth-child(10){height:58%;animation-delay:1.08s}
.nb-vis.paused i{animation-play-state:paused}
@keyframes vis{from{transform:scaleY(.35)}to{transform:scaleY(1)}}

/* ── 状态栏（Audacious 最底下一行：格式信息 / 时间） ── */
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;
  background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);
  white-space:nowrap;overflow:hidden}
.sb-left{overflow:hidden;text-overflow:ellipsis}
.sb-right{flex:0 0 auto;font-variant-numeric:tabular-nums}

/* ── 播放列表表格：列头 + 对齐的行 ── */
.thead{display:flex;align-items:center;gap:12px;padding:0 10px 6px;font-size:11.5px;color:var(--dim);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.thead>span:nth-child(1){flex:0 0 24px}
.thead>span:nth-child(2){flex:0 0 32px}
.thead .tinfo{flex:1;min-width:0;display:grid;grid-template-columns:1fr 168px 150px;gap:12px}
.thead>span:nth-child(4){flex:0 0 84px}
.thead>span:nth-child(5){flex:0 0 56px;text-align:right}
.thead>span:nth-child(6){flex:0 0 28px}
.thead>span:nth-child(7){flex:0 0 28px}
.thead span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 迷你模式：窗口被 Go 端缩成 356×104 并去掉了标题栏，四角由 Win32 圆角区域裁掉，
   所以这里的卡片要铺满整个窗口，圆角和裁剪保持一致 */
/* 迷你播放器：桌面上的小浮卡。
   窗口 348×124 是「卡片 + 探出去的圆封面」的整体轮廓，Win32 那边按同一组坐标裁区域，
   所以卡片圆角外、封面圆外的像素都不存在，看起来就是贴在桌面上的一张贴纸。
   下面这些固定像素要和 win_floating.go 里的 miniW、miniH、mCard、mCov 常量保持一致。
   配色一律用主题变量，橘黄 / 冷白 / 深色下都跟主界面同一套。 */
.app.mini-mode{display:block;grid-template-columns:none;grid-template-rows:none;background:var(--bg)}
.app.mini-mode > .skin-page,.app.mini-mode > .menubar,.app.mini-mode > .toolbar,.app.mini-mode > main,
.app.mini-mode > .nowband,.app.mini-mode > .statusbar,.app.mini-mode > footer{display:none}

.mini-player{position:fixed;left:0;top:0;width:348px;height:124px;z-index:50;
  display:block;overflow:visible;background:var(--bg);color:var(--txt)}
.mini-card{position:absolute;left:10px;top:30px;width:328px;height:88px;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;
  box-sizing:border-box;overflow:visible;
  cursor:grab;user-select:none;-webkit-user-select:none}
.mini-card:active{cursor:grabbing}
.mini-cover{position:absolute;left:-2px;top:-22px;width:94px;height:94px;border-radius:50%;
  background-color:var(--cover);background-position:center;background-size:cover;background-repeat:no-repeat;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(60,40,10,.28),inset 0 0 0 1px rgba(255,255,255,.5)}
.mini-cover.empty{background-image:linear-gradient(140deg,var(--cover),var(--panel))}
.mini-cover,.mini-cover.empty{padding:0;box-sizing:border-box}
.mini-card .mini-cover{height:94px;min-height:94px;max-height:94px}
.mini-cover-ph{font-size:30px;color:var(--dim)}
/* 卡片上半条留给歌词，下半条给按钮；右列三个小按钮不动 */
.mini-lyric{position:absolute;left:100px;right:40px;top:6px;height:17px;line-height:17px;
  font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;
  pointer-events:none;letter-spacing:.1px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 10px),transparent 100%)}
.mini-lyric.scroll{animation:miniLyricRun var(--dur,6s) ease-in-out infinite alternate}
@keyframes miniLyricRun{from{transform:translateX(0)}to{transform:translateX(var(--shift,0px))}}
.mini-ops{position:absolute;left:100px;right:40px;top:23px;bottom:1px;
  display:flex;align-items:center;justify-content:space-between;gap:1px}
.mini-ops button{border:none;background:transparent;color:var(--dim);cursor:pointer;
  width:33px;height:34px;border-radius:50%;padding:0;
  display:flex;align-items:center;justify-content:center;transition:transform .14s,color .14s}
.mini-ops button:hover{color:var(--txt);transform:scale(1.08)}
.mini-ops button:disabled{opacity:.4;cursor:default;transform:none}
.mini-ops .mini-fav{color:var(--heart)}
.mini-ops .mini-fav.on{color:var(--heart-on);filter:drop-shadow(0 0 7px rgba(224,75,58,.4))}
.mini-ops .mini-play{width:44px;height:44px;background:var(--acc);color:var(--on-acc-text);
  box-shadow:0 5px 14px rgba(232,134,26,.34)}
.mini-ops .mini-play:hover{filter:brightness(1.08);transform:scale(1.05)}
.mini-ops .mini-play:disabled{background:var(--acc);color:var(--on-acc-text);box-shadow:none;filter:none;opacity:.72}

/* 右列竖排：换皮肤（衣服）／放大还原／关闭。卡片只有 88 高，三个 22 的按钮刚好排满一列 */
.mini-tools{position:absolute;right:5px;top:5px;display:flex;flex-direction:column;gap:2px}
.mini-tools button{width:22px;height:22px;border:none;background:transparent;color:var(--dim);
  cursor:pointer;padding:0;border-radius:6px;
  display:flex;align-items:center;justify-content:center;transition:color .12s,background .12s}
.mini-tools button:hover{color:var(--acc);background:var(--hover)}
.mini-btn{border:none;background:transparent;color:var(--dim);cursor:pointer;width:28px;height:28px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mini-btn:hover{color:var(--acc);background:var(--hover)}

/* 侧边栏 */
.side{grid-row:1/2;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;transition:background .18s}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px}
.dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.dot-img{width:30px;height:30px;object-fit:cover;border-radius:8px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:.3px}
.brand em{font-style:normal;font-size:11px;color:var(--dim)}
.theme-btn{margin-left:auto;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.theme-btn:hover{color:var(--txt);background:var(--hover);border-color:var(--acc2)}

.searchbox{display:flex;gap:6px}
.searchbox input{flex:1;min-width:0;background:var(--input);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:13px;outline:none}
.searchbox input:focus{border-color:var(--acc2)}
.searchbox input::placeholder{color:var(--dim)}
.searchbox button{background:var(--acc2);border:0;color:#fff;border-radius:8px;padding:0 14px;cursor:pointer;font-size:13px}
.searchbox button:disabled{opacity:.5;cursor:default}

nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;background:transparent;border:0;color:var(--dim);text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
nav button:hover{background:var(--hover);color:var(--txt)}
nav button.on{background:var(--sel);color:var(--txt)}
.count{font-size:11px;color:var(--dim);background:var(--input);border-radius:999px;padding:1px 7px}

.chart-list{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.chart{background:transparent;border:0;color:var(--dim);text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:12.5px}
.chart:hover{background:var(--hover);color:var(--txt)}
.chart.on{color:var(--acc);background:var(--now-bar)}

/* 主区 */
.main{padding:12px 16px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:0 4px;flex:0 0 auto}
.head h1{font-size:15px;font-weight:600;color:var(--txt)}
.head p{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{color:#e5484d;font-size:12.5px;max-width:52%;text-align:right;line-height:1.45}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;color:var(--txt);text-align:left;box-shadow:var(--shadow)}
.card:hover{border-color:var(--acc2);transform:translateY(-1px)}
.card-ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ico-from),var(--acc2))}
.card span{font-size:14px}

.list{display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
.row{display:flex;align-items:center;gap:10px;padding:4px 10px;border-radius:6px;position:relative;min-height:38px}
.row:hover{background:var(--hover)}
.row.on{background:var(--now-bar)}
.idx{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:11px}
.row:hover .idx{border-color:var(--acc);color:var(--acc)}
.cover{width:32px;height:32px;flex:0 0 32px;border-radius:5px;background-color:var(--cover);background-position:center;background-size:cover;background-repeat:no-repeat}
.info{flex:1;min-width:0;display:grid;grid-template-columns:1fr 168px 150px;gap:12px;align-items:center}
.name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ca{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.dur{font-size:12px;color:var(--dim);width:44px;text-align:right}
.heart{background:transparent;border:0;color:var(--heart);cursor:pointer;font-size:15px;padding:0 4px;opacity:.7}
.heart:hover,.heart.on{opacity:1}
.heart:hover{color:var(--heart-on)}
.heart.on{color:var(--heart-on)}
.empty{color:var(--dim);font-size:13px;padding:60px 0;text-align:center}

/* 播放条 */
.bar{grid-column:1/3;display:grid;grid-template-columns:300px auto 1fr 1fr;align-items:center;gap:20px;background:var(--panel);border-top:1px solid var(--line);padding:0 22px;transition:background .18s}
.now{display:flex;align-items:center;gap:10px;min-width:0}
.mini{width:44px;height:44px;flex:0 0 44px;border-radius:9px;background-color:var(--cover);background-position:center;background-size:cover;background-repeat:no-repeat}
.n1{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n2{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc-text);font-size:15px;cursor:pointer}
.play:disabled{opacity:.4;cursor:default}
.prog{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--dim)}
.prog input{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--line);outline:none;cursor:pointer}
.prog input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);border:0;cursor:pointer}
.lyric{font-size:12.5px;color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 电台卡片 */
.station{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--txt);text-align:left;box-shadow:var(--shadow)}
.station:hover{border-color:var(--acc);transform:translateY(-1px)}
.st-logo{width:44px;height:44px;flex:0 0 44px;border-radius:10px;background-color:var(--cover);background-position:center;background-size:cover;background-repeat:no-repeat}
.st-info{flex:1;min-width:0}
.st-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-desc{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-region{font-size:11px;color:var(--acc);border:1px solid var(--tag-line);border-radius:5px;padding:1px 6px}

/* 听书 */
.pod-wrap{display:flex;flex-direction:column;gap:14px}
.pod-bar{display:flex;gap:8px;align-items:center;max-width:560px}
.pod-bar input{flex:1;background:var(--input);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:13px;outline:none}
.pod-bar input:focus{border-color:var(--acc2)}
.pod-bar input::placeholder{color:var(--dim)}
.pod-bar button{background:var(--acc2);border:0;color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
.pod-bar button:disabled{opacity:.5}
.pod-bar .back{background:var(--hover);color:var(--txt);padding:8px 12px}
.card.show{align-items:flex-start;gap:10px}
.show-cover{width:52px;height:52px;flex:0 0 52px;border-radius:9px;background-color:var(--cover);background-position:center;background-size:cover;background-repeat:no-repeat}
.show-body{flex:1;min-width:0}
.show-name{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.show-sub{font-size:11.5px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog.live{display:flex;align-items:center;gap:8px;color:var(--acc);font-size:12px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* 浅色下滚动条也换掉，否则默认深色很突兀 */
:root[data-theme="amber"] ::-webkit-scrollbar,:root[data-theme="light"] ::-webkit-scrollbar{width:10px;height:10px}
:root[data-theme="amber"] ::-webkit-scrollbar-thumb,:root[data-theme="light"] ::-webkit-scrollbar-thumb{background:#cfd5e2;border-radius:6px}
:root[data-theme="amber"] ::-webkit-scrollbar-track,:root[data-theme="light"] ::-webkit-scrollbar-track{background:transparent}

/* ---------- 设置页 / 插件页 ---------- */
.set-page,.plug-page{display:flex;flex-direction:column;gap:14px;max-width:760px;padding-bottom:20px}
.set-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.set-card h3{font-size:13.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.set-card h3 .cnt{font-size:11px;color:var(--dim);background:var(--input);border-radius:999px;padding:1px 7px;font-weight:400}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 0;font-size:13px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row label{color:var(--dim);flex:0 0 auto}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--dim);padding:6px 14px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--on-acc-text)}
.seg.tabs{margin-bottom:12px;width:fit-content}
.seg.tabs button.on{background:var(--sel);color:var(--txt)}
select{background:var(--input);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:6px 10px;font-size:12.5px;outline:none}
.range-row{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end}
.range-row input{width:180px;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--line);outline:none;cursor:pointer}
.range-row input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);border:0;cursor:pointer}
.val{width:44px;text-align:right;color:var(--dim);font-size:12px}
.switch{width:38px;height:20px;border-radius:999px;border:1px solid var(--line);background:var(--input);position:relative;cursor:pointer;padding:0;flex:0 0 38px}
.switch i{position:absolute;left:2px;top:1px;width:15px;height:15px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s;display:block}
.switch.on{background:var(--acc);border-color:var(--acc)}
.switch.on i{left:19px;background:#fff}
.chips{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:var(--input);color:var(--dim);border-radius:999px;padding:5px 14px;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--now-bar)}
.num{width:80px;background:var(--input);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:6px 10px;font-size:12.5px;outline:none;text-align:right}
.mono{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--dim)}
.ellipsis{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.dir-row{display:flex;align-items:center;gap:8px;min-width:0}
.mini-btn{border:1px solid var(--line);background:var(--input);color:var(--txt);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer}
.mini-btn:hover{border-color:var(--acc2)}
.danger-btn{border:1px solid var(--heart-on);color:var(--heart-on);background:transparent;border-radius:8px;padding:5px 14px;font-size:12.5px;cursor:pointer}
.danger-mini{border:0;background:transparent;color:var(--dim);font-size:12px;cursor:pointer;padding:4px 6px}
.danger-mini:hover{color:var(--heart-on)}
.primary-btn{background:var(--acc);border:0;color:var(--on-acc-text);border-radius:8px;padding:7px 18px;font-size:13px;cursor:pointer;font-weight:500}
.primary-btn:disabled{opacity:.5;cursor:default}
.ghost-btn{background:var(--hover);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer}
.set-actions{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
.ok-msg{color:var(--acc);font-size:12.5px}
.err-msg{color:var(--heart-on);font-size:12.5px;line-height:1.5}
.hint{font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.hint code{font:11.5px ui-monospace,Consolas,monospace;background:var(--input);padding:1px 5px;border-radius:4px}
.plug-install{display:flex;gap:8px;align-items:center}
.plug-install.col{flex-direction:column;align-items:stretch}
.plug-install input,.plug-test input{flex:1;background:var(--input);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:13px;outline:none}
.plug-install input:focus,.plug-test input:focus{border-color:var(--acc2)}
.plug-install textarea{background:var(--input);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px;font:12px/1.5 ui-monospace,Consolas,monospace;outline:none;resize:vertical}
.plug-list{display:flex;flex-direction:column;gap:8px}
.plug-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--input)}
.plug-item.sel{border-color:var(--acc)}
.plug-main{flex:1;min-width:0}
.plug-name{font-size:13.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.plug-ver{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.plug-off{font-size:11px;color:var(--heart-on);border:1px solid var(--heart-on);border-radius:5px;padding:0 5px;opacity:.75}
.plug-sub{font-size:11.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plug-ops{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.plug-test{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.empty.small{padding:20px 0;font-size:12.5px}

/* ---------- 二级播放界面（Now Playing） ---------- */
.np{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  --np-acc:#7d93ff;--np-track:rgba(255,255,255,.16);
  --np-txt:#eef1fa;--np-dim:rgba(224,229,247,.42);--np-bg:#1b2140;
  color:var(--np-txt);background:var(--np-bg);overflow:hidden;
  animation:npIn .26s cubic-bezier(.22,.72,.3,1);
}
@keyframes npIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.np-bg{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(760px 520px at 12% 4%, rgba(80,110,230,.34) 0%, rgba(80,110,230,0) 62%),
    radial-gradient(680px 480px at 88% 96%, rgba(226,120,160,.20) 0%, rgba(226,120,160,0) 64%),
    linear-gradient(172deg,#202747 0%,#1b2140 52%,#171c37 100%);
}
.np-bg-cover{
  position:absolute;inset:-10%;pointer-events:none;
  background-position:center;background-size:cover;
  filter:blur(80px) saturate(1.1);opacity:.22;
}
.np-top{position:relative;z-index:2;height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;padding:0 28px;width:100%;max-width:1280px}
.np-back{width:36px;height:36px;flex:0 0 36px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);color:var(--np-txt);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .16s,border-color .16s}
.np-back:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3)}
.np-crumb{display:flex;flex-direction:column;gap:2px;min-width:0}
.np-label{font-size:10px;letter-spacing:1.6px;color:var(--np-dim)}
.np-crumb-title{font-size:14px;color:var(--np-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-busy{margin-left:auto;font-size:12px;color:var(--np-acc)}

.np-body{position:relative;z-index:2;flex:1;min-height:0;display:flex;gap:56px;padding:6px 56px 0;width:100%;max-width:1280px}
.np-left{width:clamp(240px,38vh,340px);flex:0 0 auto;display:flex;flex-direction:column;min-height:0}
.np-cover{width:100%;aspect-ratio:1/1;height:auto;border-radius:14px;background-color:rgba(255,255,255,.06);
  background-position:center;background-size:cover;background-repeat:no-repeat;
  box-shadow:0 26px 60px rgba(6,10,26,.5)}
.np-title{margin-top:22px;font-size:26px;font-weight:600;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{margin-top:6px;font-size:13px;color:var(--np-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-ops{margin-top:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.np-chip{height:30px;padding:0 13px;border-radius:15px;border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.045);color:#c9d0e8;font-size:12px;font-family:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .16s,color .16s,border-color .16s}
.np-chip:hover{background:rgba(255,255,255,.11);color:#fff}
.np-chip.on{color:#ff8199;border-color:rgba(255,129,153,.45);background:rgba(255,129,153,.1)}
.np-chip:disabled{opacity:.45;cursor:default}
.np-chip.static{cursor:default;color:var(--np-dim)}
.np-err{font-size:12px;color:#ff8199;max-width:100%}

.np-right{flex:1;min-width:0;position:relative}
/* 二级页右侧待播清单 */
.np-queue{width:236px;flex:0 0 auto;display:flex;flex-direction:column;min-height:0;
  border-left:1px solid rgba(255,255,255,.14);padding-left:22px}
.npq-head{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.6px;
  color:rgba(255,255,255,.62);margin-bottom:12px}
.npq-head em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;
  background:rgba(255,255,255,.14);color:#fff}
.npq-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;
  padding-right:4px}
.npq-row{display:flex;align-items:flex-start;gap:10px;padding:7px 8px 7px 4px;border-radius:9px;cursor:pointer;
  transition:background .15s}
.npq-row:hover{background:rgba(255,255,255,.10)}
.npq-n{width:14px;flex:0 0 auto;font-size:11px;line-height:18px;color:rgba(255,255,255,.42);text-align:right}
.npq-info{min-width:0;flex:1}
.npq-info b{display:block;font-size:13px;line-height:18px;font-weight:500;color:rgba(255,255,255,.90);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.npq-info em{display:block;font-style:normal;font-size:11px;color:rgba(255,255,255,.5);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.npq-x{flex:0 0 auto;align-self:center;border:none;background:transparent;color:rgba(255,255,255,.35);
  font-size:14px;line-height:1;padding:2px 6px;border-radius:6px;cursor:pointer;opacity:0;transition:.15s}
.npq-row:hover .npq-x{opacity:1}
.npq-x:hover{background:rgba(255,255,255,.16);color:#fff}
@media (max-width:1120px){.np-queue{display:none}}
.np-lyric-box{position:relative;height:100%;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 84%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 84%,transparent 100%)}
.np-lyric-lines{position:absolute;top:50%;left:0;right:0;
  transition:transform .38s cubic-bezier(.25,.8,.3,1)}
.np-line{font-size:17px;color:var(--np-dim);padding-left:16px;position:relative;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s,font-size .3s}
.np-line:hover{color:rgba(224,229,247,.7)}
.np-line.on{font-size:23px;font-weight:500;color:var(--np-txt)}
.np-line.on::before{content:'';position:absolute;left:0;top:50%;width:3px;height:26px;margin-top:-13px;
  border-radius:2px;background:var(--np-acc)}
.np-lyric-empty{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);
  font-size:14px;color:var(--np-dim);padding-left:16px}

.np-bottom{position:relative;z-index:2;flex:0 0 auto;padding:10px 56px 26px;display:flex;flex-direction:column;gap:14px;width:100%;max-width:1280px}
.np-prog{display:flex;align-items:center;gap:14px}
.np-time{font-size:11.5px;color:var(--np-dim);width:42px;text-align:center;font-variant-numeric:tabular-nums}
.np-live{display:flex;align-items:center;gap:8px;color:var(--np-acc);font-size:12px;justify-content:center}
.np-range{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;outline:none;cursor:pointer}
.np-range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:#fff;border:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.np-range.small{width:120px;flex:0 0 120px;height:3px}
.np-range.small::-webkit-slider-thumb{width:9px;height:9px}
.np-controls{display:flex;align-items:center;justify-content:center;gap:28px}
.np-ctrl{width:32px;height:32px;border:0;background:none;color:var(--np-txt);opacity:.85;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;transition:opacity .16s,color .16s}
.np-ctrl:hover{opacity:1}
.np-ctrl.on{color:var(--np-acc);opacity:1}
.np-ctrl:disabled{opacity:.35;cursor:default}
.np-play{width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(255,255,255,.11);color:#f5f7ff;
  display:flex;align-items:center;justify-content:center;transition:background .16s}
.np-play:hover{background:rgba(255,255,255,.2)}
.np-play:disabled{opacity:.4;cursor:default}
.np-vol{position:absolute;left:56px;bottom:34px;display:flex;align-items:center;gap:9px;color:var(--np-dim)}

/* 浅色主题 */
:root[data-theme="light"] .np{
  --np-acc:#4f68e0;--np-track:rgba(22,32,60,.14);
  --np-txt:#1c2138;--np-dim:rgba(28,33,56,.5);--np-bg:#f5f3fb;
}
:root[data-theme="light"] .np-bg{
  background:
    radial-gradient(760px 520px at 10% 2%, rgba(120,150,255,.28) 0%, rgba(120,150,255,0) 62%),
    radial-gradient(620px 460px at 92% 98%, rgba(240,150,180,.20) 0%, rgba(240,150,180,0) 64%),
    linear-gradient(172deg,#f7f5ff 0%,#f2f1fa 55%,#f7f2f7 100%);
}
:root[data-theme="light"] .np-bg-cover{opacity:.12;filter:blur(80px) saturate(1.2) brightness(1.15)}
:root[data-theme="light"] .np-back{border-color:rgba(22,32,60,.16);background:rgba(255,255,255,.6)}
:root[data-theme="light"] .np-back:hover{background:#fff;border-color:rgba(22,32,60,.3)}
:root[data-theme="light"] .np-chip{border-color:rgba(22,32,60,.14);background:rgba(255,255,255,.7);color:#4a5374}
:root[data-theme="light"] .np-chip:hover{background:#fff;color:#1c2138}
:root[data-theme="light"] .np-chip.on{color:#e0486f;border-color:rgba(224,72,111,.4);background:rgba(224,72,111,.08)}
:root[data-theme="light"] .np-line:hover{color:rgba(28,33,56,.8)}
:root[data-theme="light"] .np-cover{box-shadow:0 22px 50px rgba(40,50,90,.18)}
:root[data-theme="light"] .np-play{background:rgba(255,255,255,.85);color:#1c2138;box-shadow:0 2px 10px rgba(40,50,90,.12)}
:root[data-theme="light"] .np-play:hover{background:#fff}
:root[data-theme="light"] .np-range::-webkit-slider-thumb{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22)}
:root[data-theme="light"] .np-err{color:#d43b60}

/* 橘黄主题的二级播放页：和浅色同构，色相换暖 */
:root[data-theme="amber"] .np{
  --np-acc:#e8861a;--np-track:rgba(90,55,15,.16);
  --np-txt:#2b2116;--np-dim:rgba(43,33,22,.55);--np-bg:#fff6e6;
}
:root[data-theme="amber"] .np-bg{
  background:
    radial-gradient(760px 520px at 10% 2%, rgba(255,190,110,.42) 0%, rgba(255,190,110,0) 62%),
    radial-gradient(620px 460px at 92% 98%, rgba(240,140,90,.26) 0%, rgba(240,140,90,0) 64%),
    linear-gradient(172deg,#fff9f0 0%,#fdf1de 55%,#fbeadb 100%);
}
:root[data-theme="amber"] .np-bg-cover{opacity:.13;filter:blur(80px) saturate(1.25) brightness(1.1)}
:root[data-theme="amber"] .np-back{border-color:rgba(90,55,15,.16);background:rgba(255,255,255,.62)}
:root[data-theme="amber"] .np-back:hover{background:#fff;border-color:rgba(90,55,15,.32)}
:root[data-theme="amber"] .np-chip{border-color:rgba(90,55,15,.14);background:rgba(255,255,255,.72);color:#7a5a35}
:root[data-theme="amber"] .np-chip:hover{background:#fff;color:#2b2116}
:root[data-theme="amber"] .np-chip.on{color:#d9542d;border-color:rgba(217,84,45,.42);background:rgba(217,84,45,.09)}
:root[data-theme="amber"] .np-line:hover{color:rgba(43,33,22,.82)}
:root[data-theme="amber"] .np-cover{box-shadow:0 22px 50px rgba(140,85,25,.18)}
:root[data-theme="amber"] .np-play{background:rgba(255,255,255,.86);color:#2b2116;box-shadow:0 2px 10px rgba(140,85,25,.12)}
:root[data-theme="amber"] .np-play:hover{background:#fff}
:root[data-theme="amber"] .np-range::-webkit-slider-thumb{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
:root[data-theme="amber"] .np-err{color:#cc3d22}
:root[data-theme="amber"] .mask{background:rgba(60,40,20,.35)}

/* 底部播放条：点击进二级 */
.now{cursor:pointer;border-radius:9px;padding:3px 6px;margin-left:-6px;transition:background .16s}
.now:hover{background:var(--hover)}

/* 插件规范徽标：区分 MyGo（目录插件）和 MusicFree（单文件） */
.plug-kind {
  font-size: 11px;
  padding: 1px 6px;
  margin-left: 6px;
  border-radius: 6px;
  background: rgba(120, 120, 200, 0.14);
  color: #6b6bb0;
  vertical-align: 1px;
}
html[data-theme='dark'] .plug-kind {
  background: rgba(160, 170, 255, 0.16);
  color: #aab4ff;
}

/* 扫码登录弹窗 */
.mask{
  position:fixed;inset:0;z-index:60;
  background:rgba(8,10,14,.55);
  display:flex;align-items:center;justify-content:center;
}
:root[data-theme="light"] .mask{background:rgba(28,32,42,.35)}
.qr-card{
  width:320px;padding:20px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 18px 48px rgba(0,0,0,.28);
  text-align:center;
}
.qr-card h4{font-size:14px;margin-bottom:6px}
.qr-tip{font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:14px}
.qr-img{
  width:220px;height:220px;display:block;margin:0 auto;
  background:#fff;border-radius:8px;padding:6px;
}
.qr-fallback{font-size:12px;color:var(--dim);line-height:1.7;text-align:left;word-break:break-all}
.qr-fallback code{display:block;margin-top:8px;font-size:11px;color:var(--txt)}
.qr-ops{margin-top:16px;display:flex;justify-content:center}

/* 插件设置项 */
.plug-settings{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.set-row{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;align-items:center}
.set-label{font-size:12px;color:var(--dim)}
.set-row input{
  background:var(--input);border:1px solid var(--line);border-radius:8px;
  color:var(--txt);padding:7px 10px;font-size:12px;outline:none;width:100%;
}
.set-row input:focus{border-color:var(--acc2)}
.set-help{grid-column:2;font-style:normal;font-size:11px;color:var(--dim);line-height:1.6}

/* 插件账号 */
.acct{display:flex;align-items:center;gap:12px;margin-top:6px}
.acct img,.acct .acct-ico{
  width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
}
.acct b{display:block;font-size:13px}
.acct em{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:2px}
.acct button{margin-left:auto}

/* 搜索结果里「插件要登录」的提示条上那几个扫码按钮 */
.need-login {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.need-login .primary-btn {
  padding: 5px 12px;
  font-size: 12px;
  border-radius: 8px;
}

/* 只有文字、没有二维码的提示（插件登录成功后的「Signed in」） */
.qr-title.ok{color:var(--acc)}
.qr-from{font-size:11px;color:var(--dim);letter-spacing:.4px;margin-bottom:2px}

/* 已登录账号条 + 登出 */
/* 设置页：账号列表 */
.set-hint{font-size:12px;color:var(--dim);margin:-4px 0 10px;line-height:1.6}
.acct-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.acct-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--input)}
.acct-main{display:flex;align-items:baseline;gap:8px;min-width:0}
.acct-main b{font-size:13px}
.acct-main em{font-style:normal;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-empty{font-size:13px;color:var(--dim);padding:10px 0 12px}

/* 轻提示 */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:60;
  background:rgba(20,22,30,.86);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;
  pointer-events:none;animation:toast-in .18s ease-out}
:root[data-theme="light"] .toast,:root[data-theme="amber"] .toast{background:rgba(255,255,255,.96);color:#1c2138;
  box-shadow:0 6px 20px rgba(30,40,70,.18)}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

.ghost-btn.danger{color:var(--heart-on)}
.acct-ops{display:flex;gap:8px;margin-left:auto}

/* 本地乐库 */
.local-page{display:flex;flex-direction:column;gap:12px;min-height:0}
.local-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dir-chip{display:inline-flex;align-items:center;gap:6px;max-width:360px;padding:5px 6px 5px 11px;
  border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim)}
.dir-chip>span,.dir-chip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir-chip button{border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:13px;line-height:1;padding:2px 4px;border-radius:6px}
.dir-chip button:hover{background:var(--heart-on);color:#fff}

/* 播放列表 */
.queue-page{display:flex;flex-direction:column;gap:10px;min-height:0}
.queue-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--dim)}
.row .rm{border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 8px;border-radius:6px}
/* 加入待播 */
.row .add{border:1px dashed var(--line);background:transparent;color:var(--dim);cursor:pointer;
  font-size:13px;line-height:1;padding:5px 7px;border-radius:7px;margin-right:2px;transition:.15s}
.row .add:hover{border-color:var(--acc);color:var(--acc);background:var(--hover)}
/* 待播清单分组 */
.q-ops{display:flex;gap:8px;align-items:center}
.q-ops .ghost-btn{font-size:12px;padding:5px 10px}
.q-group{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.4px;
  color:var(--dim);text-transform:none;margin:16px 0 8px}
.q-group em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;
  background:var(--hover);color:var(--dim)}
.q-group.dim{opacity:.75}
.q-tip{padding:6px 2px 2px}
.list.dim{opacity:.62}
.row .rm:hover{background:var(--heart-on);color:#fff}

/* ══════════════════════════════════════════════════════
   葫芦音乐经典皮肤（Winamp2 风格四窗堆叠）
   ══════════════════════════════════════════════════════ */
.skin{display:block;height:100%;background:#0e1020}
.skin-page{height:100%;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,#151832,#0b0d1c 60%,#0a0b16);align-items:stretch;
  max-width:820px;margin:0 auto;box-sizing:border-box}

.sk-panel{background:linear-gradient(180deg,#303680 0%,#1c1f5c 38%,#151748 100%);
  border:1px solid #0a0b28;border-radius:3px;overflow:hidden;color:#d9ddff;font-size:12px;flex:0 0 auto;
  box-shadow:inset 0 1px 0 rgba(190,200,255,.28),inset 1px 0 0 rgba(190,200,255,.10),
             inset 0 -1px 0 rgba(0,0,0,.55),0 3px 12px rgba(0,0,0,.45)}

.sk-title{display:flex;align-items:center;gap:7px;height:25px;padding:0 6px;flex:0 0 auto;
  background:linear-gradient(180deg,#5b63c0 0%,#3a4198 48%,#262b72 100%);
  border-bottom:1px solid #0a0b28;font-size:11.5px;color:#eef0ff;
  text-shadow:0 1px 1px rgba(0,0,0,.65);letter-spacing:.3px}
.sk-title img{width:15px;height:15px;border-radius:3px;object-fit:cover;flex:0 0 auto}
.sk-title .t{margin-left:2px}
.sk-win-btns{margin-left:auto;display:flex;gap:3px}
.sk-wb{width:15px;height:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:linear-gradient(180deg,#c6cbff,#7d85dd 60%,#4e56b4);border:1px solid #23266b;border-radius:2px;
  color:#1b1e50;font-size:10px;line-height:1;padding:0}
.sk-wb:active{background:linear-gradient(180deg,#98a0ee,#5c64c2)}

/* 主窗口 */
.sk-win{padding-bottom:6px}
.sk-body{display:flex;gap:8px;padding:6px 7px 2px}
.sk-spec{flex:1;min-width:0;height:84px;display:flex;align-items:flex-end;gap:2px;padding:6px 5px;
  background:repeating-linear-gradient(180deg,#0a0c26 0 7px,#0d1030 7px 8px);
  border:1px solid #0a0b28;border-radius:2px;box-shadow:inset 0 0 14px rgba(0,0,0,.75)}
.sk-spec i{display:block;flex:1;min-width:2px;height:100%;border-radius:1px 1px 0 0;
  background:linear-gradient(180deg,#c9cfff 0%,#7d88ff 45%,#3c45c8 100%);
  transform-origin:bottom;transform:scaleY(.15);animation:skvis 1.1s ease-in-out infinite alternate}
.sk-spec.paused i{animation-play-state:paused;transform:scaleY(.3)}
.sk-spec i:nth-child(3n){animation-delay:.3s}.sk-spec i:nth-child(4n){animation-delay:.55s}
.sk-spec i:nth-child(5n){animation-delay:.75s}.sk-spec i:nth-child(7n){animation-delay:.95s}
.sk-spec i:nth-child(2n){animation-delay:.18s}.sk-spec i:nth-child(9n){animation-delay:1.25s}
@keyframes skvis{from{transform:scaleY(.1)}to{transform:scaleY(.92)}}
.sk-side{width:190px;flex:0 0 auto;display:flex;flex-direction:column;gap:5px;justify-content:flex-start}
.sk-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;
  color:#eef0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-line .k{color:#aab3f2;font-size:11px}
.sk-line .v{color:#fff;overflow:hidden;text-overflow:ellipsis}
.sk-time{font-variant-numeric:tabular-nums;color:#fff;font-size:12px;letter-spacing:.5px}
.sk-status{font-size:11px;color:#a9b2ea;display:flex;align-items:center;gap:6px}
.sk-led{width:6px;height:6px;border-radius:50%;background:#3ddc84;box-shadow:0 0 6px #3ddc84}
.sk-led.off{background:#3a3f78;box-shadow:none}
.sk-mini-btns{display:flex;gap:4px;margin-top:auto}
.sk-mini-btns button{flex:0 0 auto;width:38px;height:19px;font-size:10.5px;letter-spacing:.5px;color:#dfe3ff;cursor:pointer;
  background:linear-gradient(180deg,#7e87e2,#4a52ab 55%,#333a8f);border:1px solid #23266b;border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.sk-mini-btns button.on{background:linear-gradient(180deg,#a9b2ff,#6a72d6 55%,#434aa6);color:#fff}

/* 进度条 */
.sk-seek{display:flex;align-items:center;gap:6px;padding:4px 8px 0}
.sk-seek .tt{font-size:10.5px;color:#b7bff0;font-variant-numeric:tabular-nums;flex:0 0 auto}
.sk-seek input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
  background:linear-gradient(180deg,#0a0c26,#1a1d52);border:1px solid #0a0b28;outline:none;cursor:pointer}
.sk-seek input::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:15px;border-radius:2px;
  background:linear-gradient(180deg,#e3e8ff,#8a93ea 55%,#4a52ab);border:1px solid #23266b;cursor:pointer}

/* 控制键 */
.sk-controls{display:flex;align-items:center;justify-content:center;gap:9px;padding:7px 8px 3px}
.sk-ctl{width:30px;height:30px;border-radius:50%;cursor:pointer;color:#e8ebff;font-size:12px;
  display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
  background:radial-gradient(circle at 50% 22%,#8f99f0,#4a52ab 58%,#242a70);
  border:1px solid #1a1d55;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 5px rgba(0,0,0,.5)}
.sk-ctl:active{box-shadow:inset 0 2px 6px rgba(0,0,0,.55)}
.sk-ctl:disabled{opacity:.45;cursor:default}
.sk-ctl.big{width:42px;height:42px;font-size:16px}
.sk-ctl.play{background:radial-gradient(circle at 50% 22%,#b3bcff,#5f68d4 58%,#2c3382)}
.sk-pl-btn{margin-left:auto;height:22px;padding:0 10px;font-size:11px;color:#eef0ff;cursor:pointer;
  background:linear-gradient(180deg,#7e87e2,#4a52ab 55%,#333a8f);border:1px solid #23266b;border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32)}
.sk-vol{display:flex;align-items:center;gap:6px;width:110px;flex:0 0 auto}
.sk-vol input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:#0a0c26;border:1px solid #0a0b28;outline:none;cursor:pointer}
.sk-vol input::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:13px;border-radius:2px;
  background:linear-gradient(180deg,#e3e8ff,#8a93ea 55%,#4a52ab);border:1px solid #23266b}

/* 均衡器 */
.sk-eq-body{display:flex;gap:10px;padding:7px 8px 9px;align-items:stretch}
.sk-eq-row{display:flex;flex-direction:column;gap:6px;justify-content:center;width:120px;flex:0 0 auto}
.sk-eq-row .lab{font-size:10px;color:#aab3f2;margin-bottom:-2px}
.sk-eq-row input{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
  background:linear-gradient(180deg,#0a0c26,#1a1d52);border:1px solid #0a0b28;outline:none;cursor:pointer}
.sk-eq-row input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,#e3e8ff,#8a93ea 55%,#4a52ab);border:1px solid #23266b}
.sk-eq-faders{flex:1;display:flex;align-items:flex-end;gap:6px;justify-content:space-between;position:relative;
  padding:14px 10px 6px 34px;background:linear-gradient(180deg,#0b0d2a,#101238);border:1px solid #0a0b28;border-radius:2px}
.sk-eq-faders .scale{position:absolute;left:4px;top:12px;bottom:6px;display:flex;flex-direction:column;
  justify-content:space-between;font-size:9px;color:#7d86cf}
.sk-fader{width:9px;height:100%;display:flex;flex-direction:column;align-items:center;gap:0}
.sk-fader .track{flex:1;width:3px;background:linear-gradient(180deg,#3a3f8f,#23276a);border-radius:2px;position:relative}
.sk-fader .knob{position:absolute;left:-4px;width:11px;height:8px;border-radius:2px;
  background:linear-gradient(180deg,#cfd5ff,#7e87e2 55%,#454ca8);border:1px solid #23266b}

/* 播放列表 */
.sk-pl{flex:1 1 auto;min-height:340px;display:flex;flex-direction:column}
.sk-tools{display:flex;align-items:center;gap:3px;padding:5px 6px;flex:0 0 auto;
  background:linear-gradient(180deg,#262b72,#1b1e56);border-bottom:1px solid #0a0b28}
.sk-tools button{height:22px;padding:0 8px;font-size:10.5px;letter-spacing:.3px;cursor:pointer;
  color:#dfe3ff;background:linear-gradient(180deg,#7e87e2,#4a52ab 55%,#333a8f);
  border:1px solid #23266b;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);white-space:nowrap}
.sk-tools button.on{background:linear-gradient(180deg,#a9b2ff,#6a72d6 55%,#434aa6);color:#fff}
.sk-tools .sk-search{display:flex;gap:3px;margin-left:auto;flex:0 0 auto;width:210px}
.sk-tools .sk-search input{flex:1;min-width:0;height:22px;padding:0 6px;font-size:11px;color:#eef0ff;
  background:#0a0c26;border:1px solid #0a0b28;border-radius:2px;outline:none}
.sk-tools .sk-search input::placeholder{color:#6f78bd}

/* 歌词秀 */
.sk-lyr-body{flex:1;min-height:150px;padding:10px 14px;text-align:center;overflow-y:auto;
  background:linear-gradient(180deg,#0d1030,#0a0c24);display:flex;flex-direction:column;justify-content:center}
.sk-lyr-body .song{font-size:13px;color:#eef0ff;margin-bottom:2px}
.sk-lyr-body .meta{font-size:10.5px;color:#7d86cf;margin-bottom:10px}
.sk-lyr-body .ln{font-size:12px;line-height:2.05;color:#8b93d8}
.sk-lyr-body .ln.on{color:#fff;font-size:13.5px;text-shadow:0 0 10px rgba(150,160,255,.55)}
.sk-lyr-body .none{font-size:12px;color:#6f78bd}

/* 皮肤里的列表与卡片：跟着深蓝底走 */
.skin .main{padding:8px 8px 10px;gap:8px;background:transparent;color:#d9ddff}
.skin .info{grid-template-columns:1fr 118px 110px;gap:8px}
.skin .thead .tinfo{grid-template-columns:1fr 118px 110px;gap:8px}
.skin .thead>span:nth-child(4){flex:0 0 56px}
.skin .thead>span:nth-child(5){flex:0 0 46px}

.skin .head p,.skin .err{color:#a9b2ea}
.skin .thead{color:#8f98d8;border-bottom-color:rgba(255,255,255,.10);background:transparent}
.skin .row{color:#d9ddff}

.skin .row .name{color:#e6e9ff}

/* 设置 / 插件 / 乐库页在深蓝底下的配色覆盖 */
.skin .set-page,.skin .plugins-page,.skin .local-page,.skin .q-group{

}

/* ══════════════════════════════════════════════════════
   双列布局：左列（主窗口 / 均衡器 / 播放列表）+ 右列（歌词秀）
   ══════════════════════════════════════════════════════ */

  align-items:stretch;max-width:1080px;margin:0 auto;padding:8px;box-sizing:border-box;
  height:100%;overflow-y:auto;background:linear-gradient(180deg,#151832,#0b0d1c 60%,#0a0b16)}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.sk-eq-on button.on{background:linear-gradient(180deg,#a9b2ff,#6a72d6 55%,#434aa6)}
.sk-eq-on button.off{opacity:.5}

/* 双列里的列表列宽收紧 */
.skin .info{grid-template-columns:minmax(0,1fr) 82px 70px;gap:6px}

.skin .thead>span:nth-child(4){flex:0 0 44px}
.skin .thead>span:nth-child(5){flex:0 0 40px}

.skin .sk-lyr-body{justify-content:flex-start;padding-top:18px}

/* tt 皮肤里的 EQ 按钮与皮肤切换钮 */
.skin[data-skin="tt"] .sk-eq-on button{background:linear-gradient(180deg,#ffd486,#f09018 55%,#b15206);

/* 右列不再被歌词内容撑高，歌词区内部滚动 */

.skin-page .sk-col-r .sk-lyr-body{flex:1 1 0;min-height:0;overflow-y:auto;scroll-behavior:smooth}

/* ══════════ 真实可拖动的 10 段推子 ══════════ */
.sk-eq-faders{align-items:stretch}
.sk-eq-faders .scale{padding-top:2px}
.sk-fader{position:relative;width:18px;display:flex;flex-direction:column;align-items:center;min-height:110px}
.sk-fader .sk-fader-in{position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:56px;height:calc(100% - 14px);margin:0;opacity:0;cursor:ns-resize;z-index:4;
  writing-mode:vertical-lr;direction:rtl}
.sk-fader .track{position:relative;width:5px;flex:1 1 auto;margin:2px 0 1px;
  background:linear-gradient(180deg,#333866,#20244a);border-radius:3px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.sk-fader .knob{position:absolute;left:50%;transform:translateX(-50%);width:13px;height:8px;border-radius:2px;
  background:linear-gradient(180deg,#dfe4ff,#8f98e0 55%,#5a63bd);border:1px solid #2a2f6b;
  box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.5);pointer-events:none}
.sk-fader .hz{font-size:7.5px;line-height:9px;color:#8e97d8;letter-spacing:.2px;white-space:nowrap}
.skin[data-skin="tt"] .sk-fader .track{background:linear-gradient(180deg,#4a2408,#2a1204)}
.skin[data-skin="tt"] .sk-fader .knob{background:linear-gradient(180deg,#ffe9b8,#ffab35 55%,#d2690a);border-color:#7a3505}
.skin[data-skin="tt"] .sk-fader .hz{color:#d99a54}
.skin[data-skin="light"] .sk-fader .track{background:linear-gradient(180deg,#c3d9ea,#9dbfd9)}
.skin[data-skin="light"] .sk-fader .knob{background:linear-gradient(180deg,#fff,#a9dcf0 55%,#57b6da);border-color:#78a9c6}
.skin[data-skin="light"] .sk-fader .hz{color:#5b83a6}

/* 皮肤区占满窗口，去掉两侧留白 */
.skin-page{max-width:none;width:100%;padding:10px;gap:10px;
  grid-template-columns:minmax(0,1.06fr) minmax(0,1fr)}
/* 歌词从顶部开始排，不再整体垂直居中 */
.skin .sk-lyr-body{justify-content:flex-start;padding-top:12px}
.skin .sk-lyr-body .song{margin-top:0;margin-bottom:2px}
.skin .sk-lyr-body>.ln:last-child{margin-bottom:0}
/* 空歌词时那句提示仍居中 */
.skin .sk-lyr-body .none{margin:auto 0}

}

/* 宽屏下列表列宽跟着放大，标题列不再被拉得过散 */

  .skin .thead>span:nth-child(5){flex:0 0 48px}

}

/* ══════════ 歌单内部滚动条 ══════════ */

/* 关掉歌词秀后：右列不存在，网格回弹成单列铺满 */
.skin-page.only-left{grid-template-columns:minmax(0,1fr)}
.skin-page.only-left .sk-col{max-width:none}
/* 单列时主窗口/列表别被拉得过宽，封顶 1100 居中，剩余部分由面板背景吸收 */
.skin-page.only-left .sk-col>section{max-width:100%}

/* 单列时让行高撑满，播放列表往下延伸填满整屏 */
.skin-page.only-left{grid-template-rows:minmax(0,100%)}
.skin-page.only-left .sk-col{height:100%;min-height:0}

/* 单列回弹再收一档：封顶 1100px 居中，避免主窗口/列表被拉得过宽 */
.skin-page.only-left .sk-col{max-width:1100px;width:100%;margin:0 auto}

/* ══════════ 第二套桌面方案：左侧竖排导航 + 右侧内容 + 底部播放条 ══════════ */
/* ───────────────────── 桌面界面（第二套方案）─────────────────────
   结构照 QQ 音乐那种：左边一条歌单栏，右下播放条，配色走全局主题变量。
   皮肤界面（.skin 类）完全不参与这一段，改这里不会动到皮肤。 */
.app.desk-mode{display:block}
.desk{
  height:100%;min-height:0;display:flex;gap:10px;padding:10px;
  background:var(--bg);color:var(--txt);font-size:13px;
}

/* 侧栏 */
.desk-nav{flex:0 0 208px;min-height:0;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 10px 8px}
.dn-user{display:flex;align-items:center;gap:9px;padding:0 4px 12px}
.dn-ava{width:30px;height:30px;border-radius:50%;flex:0 0 30px;object-fit:cover}
.dn-id{display:flex;align-items:center;gap:5px;min-width:0}
.dn-id b{font-size:13.5px;font-weight:600;white-space:nowrap}
.dn-chip{font-size:9.5px;line-height:1.6;padding:0 4px;border-radius:3px;white-space:nowrap;
  border:1px solid var(--line);color:var(--dim)}
.dn-chip.gold{border-color:rgba(232,180,80,.55);color:#e8b450}
.dn-caret{margin-left:auto;width:22px;height:22px;border:0;border-radius:6px;background:transparent;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dn-caret:hover{background:var(--hover);color:var(--txt)}

.dn-cards{display:flex;gap:8px;padding:0 2px 12px}
.dn-card{width:56px;height:56px;border-radius:8px;border:1px dashed var(--line);background:var(--cover);
  background-position:center;background-size:cover;color:var(--dim);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.dn-card.on{border-style:solid;border-color:var(--acc2)}
.dn-card.add:hover{border-color:var(--acc2);color:var(--acc2)}

.dn-quick{display:flex;flex-direction:column;gap:1px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dn-quick button{display:flex;align-items:center;gap:9px;padding:9px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--txt);font-size:12.5px;cursor:pointer;text-align:left}
.dn-quick button:hover{background:var(--hover)}
.dn-quick button.on{background:var(--sel);font-weight:600}
.dn-quick .dn-ico{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.dn-quick button.on .dn-ico{color:var(--acc2)}
.dn-quick .dn-lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-quick em{font-style:normal;font-size:11px;color:var(--dim)}

.dn-grp{display:flex;align-items:center;gap:6px;padding:11px 10px 6px;color:var(--dim);font-size:11.5px}
.dn-grp span{flex:1}
.dn-grp button{width:20px;height:20px;border:0;border-radius:5px;background:transparent;color:var(--dim);
  cursor:pointer;font-size:13px;line-height:1}
.dn-grp button:hover{background:var(--hover);color:var(--acc2)}

.dn-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding-bottom:4px}
.dn-plist{display:flex;flex-direction:column;gap:1px}
.dn-scroll::-webkit-scrollbar{width:6px}
.dn-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.dn-plist button{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--txt);cursor:pointer;text-align:left;min-width:0}
.dn-plist button:hover{background:var(--hover)}
.dn-plist button.on{background:var(--sel);font-weight:600}
.dn-pl-cover{width:26px;height:26px;flex:0 0 26px;border-radius:5px;background:var(--cover) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim)}
.dn-pl-name{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-plist em{font-style:normal;font-size:10.5px;color:var(--dim)}
.dn-empty{padding:6px 10px;font-size:11px;line-height:1.6;color:var(--dim)}
/* 自建歌单：条目 + hover 出现的删除、行内新建 */
.dn-pl{position:relative;display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--txt);cursor:pointer;text-align:left;min-width:0}
.dn-pl:hover{background:var(--hover)}
.dn-pl.on{background:var(--sel);font-weight:600}
.dn-pl em{font-style:normal;font-size:10.5px;color:var(--dim)}
.dn-pl-del{margin-left:2px;width:16px;height:16px;flex:0 0 16px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;opacity:0}
.dn-pl:hover .dn-pl-del{opacity:.85}
.dn-pl-del:hover{background:rgba(255,90,100,.2);color:#ff8a8a;opacity:1}
.dn-pl-del.confirm{opacity:1;width:auto;flex:0 0 auto;padding:0 6px;background:#ff4d5e;color:#fff;font-size:10px}
.dn-newpl{display:flex;gap:5px;padding:4px 8px 7px}
.dn-newpl input{flex:1;min-width:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line);
  background:var(--input);color:var(--txt);font-size:11.5px;outline:none}
.dn-newpl input:focus{border-color:var(--acc2)}
.dn-newpl button{padding:0 9px;border:0;border-radius:6px;background:var(--acc);color:var(--on-acc-text);
  font-size:11px;font-weight:600;cursor:pointer;flex:0 0 auto}

/* 列表行尾「加入歌单」 */
.row .addpl{padding:0 7px;border:1px solid transparent;border-radius:6px;background:transparent;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.row .addpl:hover{color:var(--acc2);border-color:var(--line);background:var(--hover)}
.thead>span:nth-child(8){flex:0 0 28px}

/* 「加入歌单」浮层 */
.plmenu-mask{position:fixed;left:0;top:0;right:0;bottom:0;z-index:80}
.plmenu{position:fixed;z-index:81;width:196px;max-height:268px;overflow-y:auto;padding:8px;
  display:flex;flex-direction:column;gap:2px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.34)}
.plmenu-t{font-size:11px;color:var(--dim);padding:2px 6px 5px}
.plmenu button{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;border:0;border-radius:6px;
  background:transparent;color:var(--txt);font-size:12px;cursor:pointer;text-align:left}
.plmenu button:hover{background:var(--hover)}
.plmenu button span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plmenu button em{font-style:normal;font-size:10.5px;color:var(--dim);flex:0 0 auto}
.plmenu button.has{color:var(--dim)}
.plmenu-new{margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 6px 6px;padding-top:8px !important;color:var(--acc2) !important;font-weight:600}
.plmenu-empty{padding:6px 8px 4px;font-size:11px;color:var(--dim)}

.dn-foot{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:2px}
.dn-foot button{width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.dn-foot button:hover{background:var(--hover);color:var(--acc2)}

/* 主区 */
.desk-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.desk-top{display:flex;align-items:center;gap:8px;padding:4px 6px;flex:0 0 auto}
.dt-round{width:30px;height:30px;flex:0 0 30px;border:1px solid var(--line);border-radius:50%;
  background:var(--input);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dt-round:hover{color:var(--acc2);border-color:var(--acc2)}
.desk-search{display:flex;gap:6px;flex:0 1 420px;margin-left:6px}
.desk-search input{flex:1;min-width:0;padding:7px 14px;border:1px solid var(--line);border-radius:16px;
  background:var(--input);color:var(--txt);font-size:12.5px;outline:none}
.desk-search input:focus{border-color:var(--acc2)}
.desk-search button{padding:6px 16px;border:0;border-radius:16px;background:var(--acc);color:#04262c;
  font-size:12.5px;font-weight:600;cursor:pointer}
.desk-search button:disabled{opacity:.6}
.desk-top-right{margin-left:auto;display:flex;gap:6px}
.desk-top-right .ghost-btn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--input);color:var(--dim);cursor:pointer}
.desk-top-right .ghost-btn:hover{color:var(--acc2);border-color:var(--acc2)}
.dt-theme{font-size:13px;line-height:1}

.desk-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.desk-body .main{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:1180px;margin:0 auto}
.desk-body .main::-webkit-scrollbar{width:9px}
.desk-body .main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px}
.desk-body .main::-webkit-scrollbar-track{background:transparent}

/* 歌单头（只在「我的收藏 / 某张专辑」时出现） */
.dpl-hero{display:flex;gap:18px;align-items:center;padding:4px 2px 16px;flex:0 0 auto;width:100%;max-width:1180px;margin:0 auto}
.dpl-cover{width:120px;height:120px;flex:0 0 120px;border-radius:50%;
  background:var(--cover) center/cover no-repeat;display:flex;align-items:center;justify-content:center;
  font-size:34px;color:var(--dim);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.dpl-info{min-width:0;display:flex;flex-direction:column;gap:8px}
.dpl-info h2{font-size:22px;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpl-info p{font-size:12px;color:var(--dim)}
.dpl-btns{display:flex;gap:10px;margin-top:4px}
.dpl-btns button{padding:7px 18px;border-radius:16px;font-size:12.5px;cursor:pointer;border:1px solid transparent}
.dpl-main{background:var(--acc);color:#04262c;font-weight:600}
.dpl-main:hover{filter:brightness(1.06)}
.dpl-sub{border-color:var(--line);background:var(--input);color:var(--txt)}
.dpl-sub:hover{border-color:var(--acc2);color:var(--acc2)}
.dpl-btns button:disabled{opacity:.45;cursor:default}

/* 歌单排序条：拖动排序 / 按时间 / 按名称 / 按拼音。拖动那一档只在自建歌单里出现 */
.dpl-sort{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.dpl-sort button{padding:5px 13px;border-radius:14px;font-size:12px;cursor:pointer;
  border:1px solid var(--line);background:var(--input);color:var(--dim)}
.dpl-sort button:hover{border-color:var(--acc2);color:var(--acc2)}
.dpl-sort button.on{background:var(--acc);border-color:var(--acc);color:#0a1a20;font-weight:600}
.dpl-sort-tip{font-size:11.5px;color:var(--dim)}

/* 拖动排序：整行可拖，左边「握把」只是提示（不吃事件，避免挡住播放按钮） */
.row.can-drag{cursor:grab}
.row.can-drag:active{cursor:grabbing}
.dgrip{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:8px;
  display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;
  color:var(--dim);opacity:.34;pointer-events:none;transition:opacity .12s}
.row.can-drag:hover .dgrip{opacity:.9}
.row.drag-src{opacity:.35}
.row.drop-on{box-shadow:inset 0 2px 0 var(--acc)}

/* 底部播放条 */
.desk-now{flex:0 0 auto;display:grid;grid-template-columns:minmax(180px,1fr) minmax(360px,2fr) 110px;
  align-items:center;gap:16px;padding:10px 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px}
.dnp-song{display:flex;align-items:center;gap:10px;min-width:0}
.dnp-cover{width:44px;height:44px;flex:0 0 44px;border-radius:6px;
  background:var(--cover) center/cover no-repeat;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--dim)}
/* 底栏这枚小封面就是当前播放的专辑封面，点它推开「正在播放」全屏页 */
.dnp-cover.can-open{cursor:pointer;transition:transform .14s,box-shadow .14s}
.dnp-cover.can-open:hover{transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.dnp-cover.can-open:active{transform:scale(1.01)}
.dnp-meta{min-width:0;display:flex;flex-direction:column}
.dnp-meta b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnp-meta em{font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnp-heart{border:0;background:transparent;color:var(--heart);font-size:16px;cursor:pointer;padding:0 2px;flex:0 0 auto}
.dnp-heart.on{color:var(--heart-on)}

.dnp-center{display:flex;flex-direction:column;gap:6px;min-width:0}
.dnp-btns{display:flex;align-items:center;justify-content:center;gap:14px}
.dnp-ico{border:0;background:transparent;color:var(--dim);font-size:16px;cursor:pointer;padding:2px 4px}
.dnp-ico:hover,.dnp-ico.on{color:var(--acc2)}
.dnp-play{width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:#04262c;
  font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dnp-play:hover{filter:brightness(1.08)}
.dnp-vol{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.dnp-vol svg{flex:0 0 14px;opacity:.85}
.dnp-vol input{width:78px}
.dnp-prog{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;margin:0 auto}
.dnp-prog span{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.dnp-prog input{flex:1;min-width:0}

.dnp-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.dnp-right button{min-width:32px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--input);color:var(--dim);font-size:12px;cursor:pointer}
.dnp-right button:hover{color:var(--acc2);border-color:var(--acc2)}

/* 桌面模式里的列表：行更高、封面圆角、右侧心形 */
.desk .row{padding:7px 8px;border-radius:8px}
.desk .row:hover{background:var(--hover)}
.desk .row.on{background:var(--sel)}
.desk .head.hd-library{display:none}
.desk .cover{width:38px;height:38px;flex:0 0 38px;border-radius:6px}
.desk .row{min-height:52px}
.desk .info{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr)}
.desk .thead .tinfo{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr)}
.desk-body .head{align-items:flex-start}
.desk-body .head h1{font-size:17px;font-weight:600}
.desk-body .head p{font-size:11.5px;color:var(--dim)}

.desk input[type=range]{accent-color:var(--acc);-webkit-appearance:none;appearance:none;
  height:16px;background:transparent;cursor:pointer}
.desk input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
.desk input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;
  border-radius:50%;background:var(--acc);border:0;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.desk input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.desk input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc)}

.app.mini-mode > .desk{display:none}
.desk .row.on{background:var(--sel)}

/* 桌面顶栏图标按钮 */
.desk-top-right .ghost-btn.icon-only{display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:32px;padding:0}
.desk-top-right .ghost-btn.icon-only svg{display:block}
/* 侧栏底部：衣服图标 + 文字 */
.desk-switch{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.desk-switch svg{flex:0 0 auto}

/* ══════════ 桌面版歌词界面 ══════════ */
.dlp{display:flex;flex-direction:column;min-height:0;flex:1;padding:6px 4px 0}
.dlp-head{display:flex;align-items:center;gap:14px;padding:0 4px 10px;flex:0 0 auto}
.dlp-song{display:flex;flex-direction:column;min-width:0}
.dlp-song b{font-size:16px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlp-song em{font-style:normal;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlp-tools{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.dlp-tools button{padding:5px 13px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  color:var(--txt);font:12px inherit;font-family:inherit;cursor:pointer}
.dlp-tools button:hover{border-color:var(--acc)}
.dlp-tools button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dlp-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:24px 12px}
.dlp-kara{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.dlp-prev,.dlp-next{font-size:16px;line-height:1.6;color:var(--dim);opacity:.62;text-align:center;max-width:1000px}
.dlp-now{font-size:30px;line-height:1.45;font-weight:600;text-align:center;max-width:1040px;color:var(--txt)}
.dlp-none{font-size:13px;color:var(--dim)}
.dlp .ln{font-size:15px;line-height:1.95;color:var(--dim);text-align:center;width:100%;max-width:1000px}
.dlp .ln.on{font-size:19px;font-weight:600;color:var(--txt)}
.dlp .kowrap{position:relative;display:inline-block;max-width:100%}
.dlp .kbase{color:inherit}
.dlp .kfill{position:absolute;left:0;top:0;white-space:nowrap;overflow:hidden;color:var(--acc);pointer-events:none}
.dlp-body::-webkit-scrollbar{width:10px}
.dlp-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid transparent;background-clip:content-box}
.dlp-body::-webkit-scrollbar-track{background:transparent}

/* 插件账号卡片的提示与报错 */
.acct-hint{margin:8px 0 0;font-size:12px;color:var(--dim)}
.acct-err{margin:8px 0 0;font-size:12px;color:#c0392b;line-height:1.6;word-break:break-word}

/* ---------- MyGo 宿主：窗口无边框，页面自己画顶部拖动条 ---------- */
/* mygo-music 那边窗口是 Frameless 的，没有系统标题栏，所以这里补一条 30px 的条：
   空白处拖动窗口，右边是最小化/关闭。Wails 版没有 window.mygo，body 不会带这个类。 */
body.mygo-frameless .app{box-sizing:border-box;padding-top:30px}
body.mygo-frameless .app.mini-mode{padding-top:0;background:transparent}
body.qq-mini{background:transparent}
body.mygo-frameless:has(.app.mini-mode){background:transparent}

.mygo-dragbar{position:fixed;left:0;right:0;top:0;height:30px;display:flex;align-items:center;
  padding:0 84px 0 12px;background:var(--panel);border-bottom:1px solid var(--line);
  color:var(--dim);font-size:12px;z-index:60;--app-region:drag}
.mygo-bar-title{flex:1;line-height:30px;letter-spacing:.5px;user-select:none}
/* 窗口按钮单独一层，绝不做 drag 容器的子元素：--app-region 会继承，按钮跟着变 drag
   的话，点击会被 mygo 当成拖窗户，click 根本到不了 onClick。 */
.mygo-winctl{position:fixed;top:0;right:6px;height:30px;display:flex;align-items:center;gap:2px;
  z-index:70;--app-region:no-drag}
.mygo-win-btn{width:34px;height:24px;border:none;background:transparent;
  color:var(--dim);cursor:pointer;border-radius:4px;font-size:13px;line-height:1;padding:0}
.mygo-win-btn:hover{background:var(--hover);color:var(--txt)}
.mygo-win-btn.close:hover{background:#e04b3a;color:#fff}

</style>
</head>
<body>
<div id="root"></div>
<!-- 开机自检：任何启动异常都显示在底部横条，避免白屏无从排查 -->
<script>
  (function () {
    var bar = document.createElement('div');
    bar.id = 'bootdiag';
    // 平时不显示；只有启动失败或运行时报错才把这条横条亮出来
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:5px 10px;display:none;' +
      'font:12px/1.4 ui-monospace,Consolas,monospace;color:#333;background:#fff8d6;' +
      'border-top:1px solid #e8dca8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    function put(msg, bad) {
      bar.textContent = msg;
      bar.style.display = 'block';
      if (bad) { bar.style.background = '#ffe3e3'; bar.style.color = '#8b1a1a'; bar.style.borderTopColor = '#e59a9a'; }
    }
    document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(bar); });
    window.addEventListener('error', function (e) {
      put('[error] ' + (e.message || '') + ' @' + (e.lineno || '?') + ':' + (e.colno || '?') +
        (e.error && e.error.stack ? ' | ' + String(e.error.stack).slice(0, 300) : ''), true);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      put('[reject] ' + String((r && (r.stack || r.message)) || r).slice(0, 300), true);
    });
    setTimeout(function () {
      var root = document.getElementById('root');
      var goMain = window.go && window.go.main && window.go.main.App;
      var n = root ? root.innerHTML.length : -1;
      var methods = goMain ? Object.keys(goMain).length : 0;
      if (!root) { put('[boot][构建 2.7.19] 找不到 #root', true); return; }
      if (!window.go) {
        put('[boot][构建 2.7.19] window.go 缺失（Wails 绑定未注入）· root=' + n + ' · theme=' + (document.documentElement.dataset.theme || 'none'), true);
        return;
      }
      if (n < 50) {
        put('[boot][构建 2.7.19] React 未渲染 · root=' + n + ' · go方法=' + methods, true);
        return;
      }
      // 一切正常就什么都不显示，只留一条控制台日志
      try { console.log('[boot][构建 2.7.19] 启动正常 · go方法=' + methods + ' · root=' + n) } catch (e) {}
    }, 1500);
  })();
</script>
